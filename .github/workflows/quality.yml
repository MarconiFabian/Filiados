name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Persistent audit state integrity
        run: npm run quality:state
      - name: Extension package matches every source file
        run: npm run extension:check
      - name: TypeScript
        id: types
        run: npm run lint
      - name: Regression tests
        id: tests
        run: npm test 2>&1 | tee quality-tests.log
      - name: Production build
        id: build
        run: npm run build
      - name: Production dependency audit
        id: audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Save audit snapshot even on failure
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.types.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: node scripts/agent-state.mjs ci
      - name: Preserve iteration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            quality-artifacts/agent-state.json
            quality-tests.log
          retention-days: 90
